<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>dont write</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header>
        <h1>Contact Me</h1>
    </header>

    <nav>
        <ul>
            <li><a href="../index.html">Home</a></li>
        </ul>
    </nav>

    <main>
        <section id="contact-info">
            <h2>Get in Touch</h2>
            <p>You can reach me at:</p>
            <ul>
                <li>Email: igorekprokyratyra@trolling.com</li>
                <li>Phone: 8 800 555 3535</li>
            </ul>
        </section>

        <section id="feedback">
            <h2>Feedback</h2>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required><br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br><br>

                <label for="age">Age:</label>
                <input type="number" id="age" name="age" min="18" max="65" required><br><br>

                <label for="country">Country:</label><br>
                <select id="country" name="country">
                    <option value="de">Germany</option>
                    <option value="ua">Ukraine</option>
                    <option value="uk">UK</option>
                </select><br><br>

                <input type="radio" id="yes" name="plan" value="I have some plans tonight" >
                <label for ="yes">I have some plans tonight</label>

                <input type="radio" id="no" name="plan" value="I dont have any plans tonight">
                <label for="no">I dont have any plans tonight</label><br><br>

                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="4" cols="50"></textarea><br><br>

                <label for="terms"><strong>I agree to the terms and conditions</strong></label>
                <input type="checkbox" id="terms" name="terms" required><br><br>

                <button type="submit">Send Message</button>
            </form>
        </section>  
    </main>
    <hr>
    <footer><p>ps: big boss</p></footer>
</body> 
</html>
